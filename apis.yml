name: Occipital
description: >-
  Occipital is a computer-vision and 3D-scanning company known for the Structure
  Sensor depth camera and the Canvas home-scanning app, built on more than fifteen
  years of spatial-computing expertise. The Canvas product line (formerly canvas.io)
  now operates as Twindo, a spatial intelligence platform that turns iPhone/iPad
  LiDAR scans, floor plans, and point clouds into accurate, editable CAD and BIM
  files for architecture, interior design, construction, remodeling, multifamily
  residential, retail, hospitality, and fire-safety professionals. As of this
  enrichment pass the company exposes end-user scanning apps, a web viewer, and a
  support center, but publishes no public developer API, SDK, or developer portal.
